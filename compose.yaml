services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    env_file:
      - path: .env.deploy
        required: true
    environment:
      NODE_ENV: production
      FRONTEND_ATLAS_DEPLOYMENT_MODE: hosted
      FRONTEND_ATLAS_PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env.deploy}
      BETTER_AUTH_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env.deploy}
      FRONTEND_ATLAS_DB_PATH: /data/coach.sqlite
      FRONTEND_ATLAS_BIND_HOST: 0.0.0.0
      FRONTEND_ATLAS_APP_PORT: 3000
      FRONTEND_ATLAS_ALLOW_DB_INITIALIZE: ${FRONTEND_ATLAS_ALLOW_DB_INITIALIZE:-0}
    volumes:
      - type: bind
        source: ./.local-data/deploy
        target: /data
    expose:
      - "3000"
    networks:
      - atlas-internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 45s
      retries: 3

  proxy:
    image: caddy:2.11.7-alpine
    profiles: ["public"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      PUBLIC_HTTP_PORT: ${PUBLIC_HTTP_PORT:-80}
      PUBLIC_HTTPS_PORT: ${PUBLIC_HTTPS_PORT:-443}
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
      - "${PUBLIC_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - atlas-internal
    security_opt:
      - no-new-privileges:true

networks:
  atlas-internal:
    driver: bridge
    internal: false

volumes:
  caddy_data:
  caddy_config:
